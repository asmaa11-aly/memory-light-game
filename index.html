<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Memory Light Game </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="amnesia.png" >
</head>

<body>
    <!-- Start Screen -->
<div id="startScreen" class="overlay">
    <div class="start-card">
        <div class="game-logo">
          
            <h1>MEMORY LIGHT</h1>
        </div>
        <p class="game-desc">Test your memory in the dark. Find all the hidden objects before time runs out!</p>
        
        <div class="game-stats-preview">
            <span>🏆 5 Levels</span>
            <span>💡 5 Hints</span>
          
        </div>

        <button id="startGameBtn">START ADVENTURE</button>
    </div>
</div>
<!-- Game Container -->
<div class="game-container">
<div id="timerBar" class="timer-bar"></div>


    <div id="gameCanvas"
    class="game-canvas">



        <img
        id="sceneImage"
        class="scene-image">

      

        <div id="hotspots-container"></div>

       

        <div class="darkness"
        id="darkness"></div>

    </div>

    <div class="top-ui">

        <div class="level-badge">

            LEVEL

            <span id="levelNumber">
                1
            </span>
     <div class="hint-box" id="hintBtn">
        <span class="hint-icon">💡</span>
        <span id="hintCount">5</span>
    </div>
        </div>

    </div>


    <div class="bottom-ui">

        <div
        id="targetsList"

        class="targets-container">

        </div>

    </div>

   

    <div
    id="winScreen"

    class="overlay hidden">

        <div class="win-card">

            <h1>
                LEVEL COMPLETE 
            </h1>

            <p>
                You found all items
            </p>

        <button id="nextBtn"> NEXT LEVEL</button>
<button id="newRunBtn"class="hidden-btn">PLAY NEW RUN</button>

        </div>

    </div>

</div>

<script src="index.js"></script>
</body>
</html>
